<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLS Studio | We've Moved!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0f12;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Glowing background accents */
        .glow {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.25) 0%, rgba(0,0,0,0) 70%);
            top: 20%;
            left: 15%;
            z-index: 1;
            animation: pulse 6s infinite alternate;
        }

        .glow-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(123, 31, 162, 0.25) 0%, rgba(0,0,0,0) 70%);
            bottom: 15%;
            right: 15%;
            z-index: 1;
            animation: pulse 8s infinite alternate-reverse;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        /* Glassmorphism Card */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 50px 40px;
            text-align: center;
            max-width: 520px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .tag {
            display: inline-block;
            background: rgba(0, 229, 255, 0.1);
            color: #00e5ff;
            border: 1px solid rgba(0, 229, 255, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .highlight {
            background: linear-gradient(90deg, #00e5ff, #7b1fa2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #a0a5b5;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .countdown-text {
            font-size: 0.9rem;
            color: #6c7284;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 16px 30px;
            background: linear-gradient(90deg, #00e5ff, #0088ff);
            color: #0d0f12;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 229, 255, 0.25);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0, 229, 255, 0.4);
            filter: brightness(1.1);
        }
    </style>
</head>
<body>

    <div class="glow"></div>
    <div class="glow-2"></div>

    <div class="card">
        <span class="tag">System Update</span>
        <h1><span class="highlight">NLS Studio</span> Has Moved</h1>
        <p>We've upgraded to a new address to provide a better experience. Update your bookmarks to stay connected with us.</p>
        
        <a href="https://your-new-url.com" class="btn" id="redirect-btn">Take Me to the New Site</a>
        
        <p class="countdown-text" style="margin-top: 20px; margin-bottom: 0;">
            Redirecting automatically in <span id="timer" style="color: #ffffff; font-weight: bold;">5</span> seconds...
        </p>
    </div>

    <script>
        // Set target domain here
        const newURL = "https://your-new-url.com"; 
        
        // Update button URL
        document.getElementById("redirect-btn").href = newURL;

        // Auto-redirect countdown
        let seconds = 5;
        const timerElement = document.getElementById("timer");

        const countdown = setInterval(() => {
            seconds--;
            timerElement.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(countdown);
                window.location.href = newURL;
            }
        }, 1000);
    </script>

</body>
</html>
