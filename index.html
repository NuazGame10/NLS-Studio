<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NLS Studio | Portal</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            height: 100vh;
            height: -webkit-fill-available;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: #000; 
            color: #f8fafc; 
            padding: 15px;
            overflow: hidden; 
            position: relative;
        }

        html {
            height: 100vh;
            height: -webkit-fill-available;
            overflow: hidden;
        }

        /* Background Glow & Grid */
        .bg-animation {
            position: fixed;
            top: 0; left: 0;
            width: 200%; height: 200%;
            background-image: 
                linear-gradient(to right, rgba(168, 85, 247, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(168, 85, 247, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -2;
            animation: moveGrid 30s linear infinite;
            pointer-events: none;
        }

        #cursor-glow {
            position: fixed;
            top: 0; left: 0;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.18) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s;
        }

        @keyframes moveGrid { 0% { transform: translate(0, 0); } 100% { transform: translate(-50px, -50px); } }

        /* Main Container Card */
        .container { 
            background: rgba(10, 10, 10, 0.96); 
            padding: 35px 25px 25px 25px; 
            border-radius: 4px; 
            box-shadow: 0 0 50px #000, 0 0 20px rgba(168, 85, 247, 0.2); 
            width: 100%; 
            max-width: 400px; 
            height: auto;
            min-height: min-content;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(51, 51, 51, 0.8); 
            text-align: center; 
            position: relative; 
            backdrop-filter: blur(20px);
            z-index: 10;
            transition: max-height 0.3s ease, height 0.3s ease;
        }

        .container.dashboard-active {
            height: 90vh;
            max-height: 660px;
        }

        h2 { font-weight: 700; letter-spacing: 4px; margin-bottom: 25px; text-transform: uppercase; color: #fff; text-shadow: 0 0 15px rgba(168, 85, 247, 0.6); font-size: 1.4rem; flex-shrink: 0; }
        
        input, select, textarea { 
            width: 100%; padding: 14px 12px; border-radius: 4px; border: 1px solid #222; 
            background: #0d0d0d; color: #fff; margin-bottom: 14px; outline: none; font-size: 14px; 
        }
        input:focus { border-color: #555; }

        .btn-primary { 
            width: 100%; padding: 15px; border: none; border-radius: 4px; 
            background: linear-gradient(90deg, #a855f7, #7e22ce); color: white; 
            font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
            flex-shrink: 0; font-size: 13px;
        }

        .btn-secondary { background: transparent; color: #444; border: 1px solid #161616; margin-top: 12px; width: 100%; padding: 14px; border-radius: 4px; cursor: pointer; flex-shrink: 0; font-size: 12px; font-weight: 500; letter-spacing: 1px; }
        
        .birthday-row { display: flex; gap: 5px; margin-bottom: 14px; flex-shrink: 0; }
        .birthday-row select { margin-bottom: 0; flex: 1; font-size: 12px; }

        .screen { display: none; width: 100%; height: 100%; }
        .screen.active-screen { display: flex; flex-direction: column; overflow: hidden; position: relative; }

        #login-screen.active-screen, #signup-screen.active-screen {
            overflow-y: auto;
            height: auto;
        }

        /* Badges Architecture */
        .role-badge { padding: 4px 10px; border-radius: 2px; font-size: 0.6rem; font-weight: bold; text-transform: uppercase; display: inline-block; white-space: nowrap; margin-top: 4px; }
        .badge-clickable { cursor: pointer; }
        .owner-bg { background: #38bdf8; color: #000; box-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
        .coowner-bg { background: transparent; color: #38bdf8; border: 1px solid #38bdf8; }
        .dev-bg { background: #a855f7; color: #fff; }
        .admin-bg { background: #ec4899; color: #fff; }
        .tester-bg { background: #10b981; color: #fff; }
        .member-bg { background: #333; color: #999; }

        #ban-modal { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: #000; padding: 30px; border-radius: 4px; border: 1px solid #ef4444; 
            width: 90%; max-width: 400px; z-index: 1000005; box-shadow: 0 0 100px #000; 
        }

        /* System Info Header */
        .os-header-decor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            border-bottom: 1px dashed rgba(168, 85, 247, 0.2);
            margin-bottom: 15px;
            font-family: monospace;
            font-size: 0.6rem;
            color: #64748b;
            flex-shrink: 0;
        }
        .sys-pulse { width: 6px; height: 6px; background: #4ade80; border-radius: 50%; display: inline-block; margin-right: 4px; box-shadow: 0 0 8px #4ade80; }

        /* User Profile Container */
        .user-profile-header {
            text-align: center;
            margin-bottom: 20px;
            flex-shrink: 0;
            background: linear-gradient(180deg, rgba(20, 20, 25, 0.4) 0%, transparent 100%);
            padding: 15px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.02);
        }
        
        .welcome-title-decor {
            font-size: 0.65rem;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 3px;
            color: #a855f7;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
            margin-bottom: 4px;
        }
        .profile-name { font-size: 1.2rem; font-weight: 700; color: #fff; letter-spacing: 0.5px; }

        /* App Launcher Matrix Setup */
        .launcher-workspace {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            justify-content: space-between;
        }

        .app-grid-layout {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
            flex: 1;
            align-content: center;
        }

        .app-item-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            cursor: pointer;
            outline: none;
            text-decoration: none;
        }

        .app-bubble {
            width: 70px;
            height: 70px;
            border-radius: 20px;
            background: linear-gradient(145deg, #121214, #08080a);
            border: 1px solid rgba(168, 85, 247, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            margin-bottom: 8px;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.05), 0 8px 16px rgba(0,0,0,0.6);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        
        .app-item-icon:active .app-bubble {
            transform: scale(0.92);
            border-color: #a855f7;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
        }

        .app-bubble::after {
            content: '';
            position: absolute;
            bottom: 6px;
            width: 4px;
            height: 4px;
            background: rgba(168, 85, 247, 0.5);
            border-radius: 50%;
        }

        /* Dynamic sizing box to keep the Red Roblox logo crisp and un-stretched */
        .roblox-svg-wrapper {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .roblox-svg-icon {
            width: 100%;
            height: 100%;
            fill: #ff3344; /* Iconic Roblox Red */
            filter: drop-shadow(0 0 8px rgba(255, 51, 68, 0.6));
            transition: transform 0.2s;
        }
        .app-item-icon:hover .roblox-svg-icon {
            transform: scale(1.08);
        }

        .app-label {
            font-size: 0.7rem;
            font-weight: 700;
            color: #94a3b8;
            text-align: center;
            width: 110px;
            word-wrap: break-word;
            white-space: normal;
            line-height: 1.2;
            letter-spacing: 0.5px;
        }

        /* Full Screen Takeover Configuration Layers */
        .android-app-layer {
            position: fixed;
            top: 0; 
            left: 0;
            width: 100vw; 
            height: 100vh;
            background: #0a0a0c;
            display: flex;
            flex-direction: column;
            z-index: 99999;
            text-align: left;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 0.76, 0.55, 0.94);
            pointer-events: none;
            padding: 20px;
        }
        .android-app-layer.app-active {
            transform: translateY(0);
            pointer-events: auto;
        }

        .small-exit-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #94a3b8;
            padding: 6px 14px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 100000;
            transition: all 0.2s;
        }
        .small-exit-btn:hover {
            background: #ef4444;
            color: #fff;
            border-color: #ef4444;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
        }

        .android-app-content {
            flex: 1;
            padding-top: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        #panel-container { display: flex; flex-direction: column; height: 100%; }
        
        #staff-panel { 
            background: #050505; 
            border: 1px solid #222; 
            width: 100%;
            flex: 1;
            overflow-y: auto;
            overflow-x: auto; 
            border-radius: 4px;
        }
        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 700px; }
        th { color: #444; font-size: 0.6rem; padding: 12px 10px; border-bottom: 1px solid #222; text-transform: uppercase; position: sticky; top: 0; background: #050505; z-index: 5; }
        td { padding: 12px 10px; border-bottom: 1px solid #111; font-size: 0.75rem; white-space: nowrap; color: #f8fafc; }
        
        .ban-btn { padding: 6px 10px; border-radius: 2px; border: none; cursor: pointer; font-size: 0.65rem; color: #fff; font-weight: bold; }
        .remove-btn { padding: 6px 10px; border-radius: 2px; border: 1px solid #333; cursor: pointer; font-size: 0.65rem; color: #666; background: transparent; margin-left: 5px; }

        .logout-btn { background: transparent; color: #444; margin-top: 15px; font-size: 0.75rem; cursor: pointer; border: none; text-decoration: underline; flex-shrink: 0; align-self: center; }
        
        .ban-box { background: rgba(239, 68, 68, 0.1); padding: 15px; border-radius: 4px; border-left: 4px solid #ef4444; text-align: left; margin: 20px 0; }
        .minimize-btn { background: #222; color: #fff; border: 1px solid #333; padding: 6px 12px; border-radius: 4px; font-size: 0.6rem; cursor: pointer; }

        .panel-search-input { width: 100%; padding: 10px; margin-bottom: 12px; font-size: 0.75rem; border: 1px solid #333; background: #111; border-radius: 4px; color: #fff; }

        .app-window-frame {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px 20px; border: 1px solid #1c1c1e; border-radius: 6px; background: #040405; text-align: center;
        }
        .app-main-logo { font-size: 2.2rem; margin-bottom: 12px; line-height: 1; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="bg-animation"></div>
    <div id="cursor-glow"></div>

    <div id="ban-modal">
        <h3 style="color: #ef4444; margin-bottom: 15px; letter-spacing: 2px;">MODERATE ACCOUNT</h3>
        <p id="ban-target-name" style="margin-bottom: 10px; font-size: 0.8rem; color: #94a3b8;"></p>
        <textarea id="ban-reason" placeholder="Type reason for ban..."></textarea>
        <button class="btn-primary" style="background: #ef4444;" onclick="submitBan()">CONFIRM BAN</button>
        <button class="logout-btn" onclick="closeBanModal()">CANCEL</button>
    </div>

    <div id="main-card-frame" class="container">
        <div id="login-screen" class="screen active-screen">
            <h2>NLS STUDIO</h2>
            <input type="text" id="login-username" placeholder="USERNAME">
            <input type="password" id="login-password" placeholder="PASSWORD">
            <button class="btn-primary" onclick="handleLogin()">SIGN IN</button>
            <button class="btn-secondary" onclick="showScreen('signup-screen')">CREATE NEW ACCOUNT</button>
        </div>

        <div id="signup-screen" class="screen">
            <h2>SIGN UP</h2>
            <div class="birthday-row">
                <select id="birth-day"></select>
                <select id="birth-month">
                    <option value="Jan">JAN</option><option value="Feb">FEB</option><option value="Mar">MAR</option>
                    <option value="Apr">APR</option><option value="May">MAY</option><option value="Jun">JUN</option>
                    <option value="Jul">JUL</option><option value="Aug">AUG</option><option value="Sep">SEP</option>
                    <option value="Oct">OCT</option><option value="Nov">NOV</option><option value="Dec">DEC</option>
                </select>
                <select id="birth-year"></select>
            </div>
            <input type="text" id="reg-username" placeholder="USERNAME">
            <input type="text" id="reg-roblox" placeholder="ROBLOX USERNAME">
            <input type="email" id="reg-email" placeholder="EMAIL">
            <input type="password" id="reg-password" placeholder="CREATE PASSWORD">
            <select id="reg-gender">
                <option value="" disabled selected>SELECT GENDER</option>
                <option value="Boy">BOY</option>
                <option value="Girl">GIRL</option>
            </select>
            <button class="btn-primary" onclick="handleSignUp()">SIGN UP</button>
            <button class="logout-btn" onclick="showScreen('login-screen')">BACK TO LOGIN</button>
        </div>

        <div id="dashboard" class="screen">
            <div class="launcher-workspace">
                
                <div class="os-header-decor">
                    <div><span class="sys-pulse"></span>SECURE SYSTEM INF</div>
                    <div>SECURE LINK</div>
                </div>
                
                <div class="user-profile-header">
                    <div class="welcome-title-decor">Welcome To NLS Studio</div>
                    <div id="user-display" class="profile-name"></div>
                    <div id="user-badge-slot"></div>
                </div>
                
                <div class="app-grid-layout">
                    <button class="app-item-icon" id="choice-admin" onclick="launchAndroidApp('admin')">
                        <div class="app-bubble">🛡️</div>
                        <div class="app-label">Admin Panel</div>
                    </button>
                    
                    <button class="app-item-icon" id="choice-settings" onclick="launchAndroidApp('settings')">
                        <div class="app-bubble">⚙️</div>
                        <div class="app-label">Settings</div>
                    </button>

                    <button class="app-item-icon" id="choice-store" onclick="launchAndroidApp('store')">
                        <div class="app-bubble" style="border-color: rgba(168, 85, 247, 0.4); text-shadow: 0 0 10px #a855f7;">⚡</div>
                        <div class="app-label">NLS Store</div>
                    </button>

                    <a href="https://www.roblox.com/communities/34495526/NLS-Studios#!/about" target="_blank" class="app-item-icon" id="choice-roblox">
                        <div class="app-bubble" style="border-color: rgba(255, 51, 68, 0.25);">
                            <div class="roblox-svg-wrapper">
                                <svg class="roblox-svg-icon" viewBox="0 0 32 32" preserveAspectRatio="xMidYMid meet">
                                    <path d="M22.75 3.5H4.25v25h6.35v-8.8h6.2l4.8 8.8h6.95l-5.65-9.85c3.25-1.2 5.05-3.65 5.05-7.55 0-4.85-2.55-7.6-5.2-7.6zm-12.15 10.9v-5.6h11c1.9 0 2.95.85 2.95 2.8 0 1.9-1.05 2.8-2.95 2.8h-11z"/>
                                </svg>
                            </div>
                        </div>
                        <div id="roblox-app-text" class="app-label">Lets Play NLS Games!!!</div>
                    </a>
                </div>

                <div style="width: 100%; display: flex; justify-content: center; flex-shrink: 0;">
                    <button class="logout-btn" onclick="handleLogout()">LOG OUT</button>
                </div>
            </div>
        </div>

        <div id="banned-screen" class="screen">
            <h1 style="color: #ef4444; letter-spacing: 5px;">🚫 BANNED</h1>
            <p style="margin-top: 10px; font-weight: bold; color: #94a3b8;">Your account has been permanently banned by NLS Studio Staff.</p>
            <div class="ban-box">
                <p style="color: #fff;"><strong>Reason:</strong> <span id="display-ban-reason" style="color: #ef4444;"></span></p>
            </div>
            <button class="btn-primary" onclick="handleLogout()">LOG OUT</button>
        </div>
    </div>


    <div id="android-app-admin" class="android-app-layer">
        <button class="small-exit-btn" onclick="closeAndroidApp('admin')">Exit</button>
        <div class="android-app-content">
            <div id="panel-container">
                <h3 id="panel-hint" style="font-size: 1rem; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px;">STAFF VIEW</h3>
                <input type="text" id="panel-search" class="panel-search-input" placeholder="SEARCH USER OR RANK..." oninput="renderTable()">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <p style="font-size: 0.6rem; color: #444; font-weight: bold;">REGISTRY DATABASE SYSTEM</p>
                    <button class="minimize-btn" id="toggle-panel-btn" onclick="togglePanelVisibility()">MINIMIZE PANEL</button>
                </div>
                <div id="staff-panel">
                    <table>
                        <thead>
                            <tr>
                                <th>User</th><th>Rank</th><th>Gender</th><th id="pass-header" style="display:none;">Pass</th><th>Status</th><th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="user-list"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="android-app-settings" class="android-app-layer">
        <button class="small-exit-btn" onclick="closeAndroidApp('settings')">Exit</button>
        <div class="android-app-content">
            <div id="settings-content" style="display: flex; flex-direction: column; height: 100%;"></div>
        </div>
    </div>

    <div id="android-app-store" class="android-app-layer">
        <button class="small-exit-btn" onclick="closeAndroidApp('store')">Exit</button>
        <div class="android-app-content">
            <div id="store-content" style="display: flex; flex-direction: column; height: 100%;"></div>
        </div>
    </div>


    <script>
        const glow = document.getElementById('cursor-glow');
        const updateGlow = (e) => {
            glow.style.opacity = "1";
            const x = (e.clientX || (e.touches && e.touches[0].clientX));
            const y = (e.clientY || (e.touches && e.touches[0].clientY));
            glow.style.left = x + 'px'; glow.style.top = y + 'px';
        };
        window.addEventListener('mousemove', updateGlow);
        window.addEventListener('touchmove', updateGlow);

        const firebaseConfig = { apiKey: "AIzaSyAjxklCo7h1l6UQwtLd-K7k4p_fe5SMh1k", authDomain: "nls-studio.firebaseapp.com", databaseURL: "https://nls-studio-default-rtdb.firebaseio.com", projectId: "nls-studio" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let accounts = []; let currentUser = null; let selectedUserIdx = null;

        const rankPower = { "owner": 100, "co-owner": 80, "developer": 60, "admin": 40, "tester": 20, "member": 0 };

        const dS = document.getElementById('birth-day'); const yS = document.getElementById('birth-year');
        for(let i=1; i<=31; i++) dS.innerHTML += `<option value="${i}">${i}</option>`;
        for(let i=2026; i>=1950; i--) yS.innerHTML += `<option value="${i}">${i}</option>`;

        db.ref('accounts').on('value', (snapshot) => {
            accounts = snapshot.val() || [];
            const session = localStorage.getItem('nls_session');
            if(session) {
                const parsed = JSON.parse(session);
                const fresh = accounts.find(a => a.name === parsed.name);
                if(fresh) {
                    currentUser = fresh;
                    if(currentUser.role === "user") currentUser.role = "member";
                    if(fresh.status === "Banned") { showBanUI(fresh.banData?.reason || "Violation of rules."); }
                    else if (document.getElementById('login-screen').classList.contains('active-screen') || document.getElementById('banned-screen').classList.contains('active-screen')) showDashboard();
                }
            }
            if(currentUser) renderTable(); 
        });

        function handleSignUp() {
            const u = document.getElementById('reg-username').value.trim();
            const r = document.getElementById('reg-roblox').value;
            const e = document.getElementById('reg-email').value;
            const p = document.getElementById('reg-password').value;
            const g = document.getElementById('reg-gender').value;
            const bD = document.getElementById('birth-day').value;
            const bM = document.getElementById('birth-month').value;
            const bY = document.getElementById('birth-year').value;
            if(!u || !r || !e || !p || !g) return alert("Fill all fields");
            if(accounts.some(acc => acc.name.toLowerCase() === u.toLowerCase())) return alert("Username Taken!");
            accounts.push({ name: u, robloxName: r, email: e, pass: p, birthday: `${bD}-${bM}-${bY}`, gender: g, role: "member", status: "Active" });
            db.ref('accounts').set(accounts).then(() => { alert("Created!"); showScreen('login-screen'); });
        }

        function handleLogin() {
            const u = document.getElementById('login-username').value;
            const p = document.getElementById('login-password').value;
            const f = accounts.find(a => a.name === u && a.pass === p);
            if (f) { 
                currentUser = f; 
                if(currentUser.role === "user" || !currentUser.role) currentUser.role = "member";
                localStorage.setItem('nls_session', JSON.stringify(currentUser)); 
                if(f.status === "Banned") showBanUI(f.banData?.reason || "Violation of rules.");
                else showDashboard(); 
            }
            else alert("Invalid Login");
        }

        function getRoleClass(role) { 
            const colors = { owner: "owner-bg", "co-owner": "coowner-bg", developer: "dev-bg", admin: "admin-bg", tester: "tester-bg", member: "member-bg" };
            return colors[role] || "member-bg";
        }

        function showDashboard() {
            showScreen('dashboard');
            let role = (currentUser.role || "member").toLowerCase();
            if(role === "user") role = "member";
            
            const displayEl = document.getElementById('user-display');
            const badgeEl = document.getElementById('user-badge-slot');
            if(displayEl) displayEl.innerText = `@${currentUser.name}`;
            if(badgeEl) badgeEl.innerHTML = `<span class="role-badge ${getRoleClass(role)}">${role.toUpperCase()}</span>`;
            
            const robloxTextEl = document.getElementById('roblox-app-text');
            if (robloxTextEl) {
                if (role === "owner") robloxTextEl.innerText = "Lets Use 100% Of Your Power!!";
                else if (role === "co-owner") robloxTextEl.innerText = "Lets Continue Your Power";
                else if (role === "developer") robloxTextEl.innerText = "Lets Continue Developing NLS Games";
                else if (role === "admin") robloxTextEl.innerText = "Lets Continue Your Adminship";
                else if (role === "tester") robloxTextEl.innerText = "Lets Test NLS Games!!!";
                else robloxTextEl.innerText = "Lets Play NLS Games!!!";
            }

            const adminBtn = document.getElementById('choice-admin');
            const storeContent = document.getElementById('store-content');
            const settingsContent = document.getElementById('settings-content');
            const panelHintEl = document.getElementById('panel-hint');

            if (role === "member") {
                if(adminBtn) adminBtn.style.display = "none";

                if(storeContent) {
                    storeContent.innerHTML = `
                        <div class="app-window-frame" style="border-color: rgba(239, 68, 68, 0.2); height: 100%;">
                            <div class="app-main-logo">🚫</div>
                            <p style="color: #ef4444; font-weight: bold; margin-bottom: 5px; font-size: 0.8rem;">UNDER DEVELOPMENT</p>
                            <p style="color: #666; font-size: 0.75rem;">Closed during engineering revisions.</p>
                        </div>`;
                }

                if(settingsContent) {
                    settingsContent.innerHTML = `
                        <div class="app-window-frame" style="border-color: rgba(239, 68, 68, 0.2); height: 100%;">
                            <div class="app-main-logo">🚫</div>
                            <p style="color: #ef4444; font-weight: bold; margin-bottom: 5px; font-size: 0.8rem;">UNDER DEVELOPMENT</p>
                            <p style="color: #666; font-size: 0.75rem;">Portal core registries are locked.</p>
                        </div>`;
                }
            } else {
                if(adminBtn) adminBtn.style.display = "flex";
                if(panelHintEl) panelHintEl.innerText = `${role.toUpperCase()} VIEW`;

                if(storeContent) {
                    storeContent.innerHTML = `
                        <div class="app-window-frame" style="border-color: rgba(168, 85, 247, 0.2); height: 100%;">
                            <div class="app-main-logo">⚡</div>
                            <p style="color: #a855f7; font-weight: bold; margin-bottom: 5px; font-size: 0.8rem;">NLS STORE DISTRIBUTION</p>
                            <p style="color: #94a3b8; font-size: 0.75rem;">Browse and distribute assets.</p>
                        </div>`;
                }

                if(settingsContent) {
                    settingsContent.innerHTML = `
                        <div class="app-window-frame" style="height: 100%;">
                            <div class="app-main-logo" style="color: #52525b;">⚙️</div>
                            <p style="color: #fff; font-weight: bold; margin-bottom: 5px; font-size: 0.8rem;">ENVIRONMENT CONFIG</p>
                            <p style="color: #666; font-size: 0.75rem; margin-bottom: 10px;">Review memory profiles and system status.</p>
                            <p style="font-size: 0.7rem; color: #444; font-family: monospace;">v2026.1.0-STABLE</p>
                        </div>`;
                }
            }

            document.querySelectorAll('.android-app-layer').forEach(win => win.classList.remove('app-active'));
            renderTable();
        }

        function launchAndroidApp(appId) {
            let role = (currentUser.role || "member").toLowerCase();
            if(role === "user") role = "member";
            if (appId === 'admin' && role === 'member') return;

            const targetApp = document.getElementById(`android-app-${appId}`);
            if(targetApp) targetApp.classList.add('app-active');
        }

        function closeAndroidApp(appId) {
            const targetApp = document.getElementById(`android-app-${appId}`);
            if(targetApp) targetApp.classList.remove('app-active');
        }

        function renderTable() {
            if (!currentUser || currentUser.role === "member" || currentUser.role === "user") return;
            const list = document.getElementById('user-list'); 
            if (!list) return;
            
            list.innerHTML = "";
            const myPower = rankPower[currentUser.role] || 0;
            const canSeePass = (myPower >= 80);

            const searchInput = document.getElementById('panel-search');
            const searchQuery = searchInput ? searchInput.value.toLowerCase() : "";

            const passHeader = document.getElementById('pass-header');
            if(passHeader) passHeader.style.display = canSeePass ? "table-cell" : "none";

            accounts.forEach((acc, index) => {
                if(acc.role === "user" || !acc.role) acc.role = "member";
                const targetPower = rankPower[acc.role] || 0;
                if (targetPower >= myPower && acc.name !== currentUser.name) return;
                if (acc.name === currentUser.name) return;

                const matchesUsername = acc.name.toLowerCase().includes(searchQuery);
                const matchesRank = acc.role.toLowerCase().includes(searchQuery);
                if (!matchesUsername && !matchesRank) return;

                const row = document.createElement('tr');
                let clickable = (myPower >= 80) ? "badge-clickable" : "";
                let content = `<td>${acc.name}</td><td><span class="role-badge ${getRoleClass(acc.role)} ${clickable}" onclick="${(myPower >= 80) ? `toggleRole(${index})` : ''}">${acc.role.toUpperCase()}</span></td><td>${acc.gender || 'N/A'}</td>`;
                if (canSeePass) content += `<td style="color:#fbbf24">${acc.pass}</td>`;
                content += `<td style="color:${acc.status === 'Banned' ? '#ef4444' : '#4ade80'}">${acc.status}</td>`;
                content += `<td><button class="ban-btn" style="background:${acc.status === 'Banned' ? '#4ade80' : '#ef4444'}" onclick="${acc.status === 'Banned' ? `unban(${index})` : `openBanModal(${index})`}">${acc.status === 'Banned' ? 'UNBAN' : 'BAN'}</button>`;
                if (currentUser.role === "owner") content += `<button class="remove-btn" onclick="removeAcc(${index})">DEL</button>`;
                row.innerHTML = content + `</td>`; 
                list.appendChild(row);
            });
        }

        function toggleRole(idx) {
            const myPower = rankPower[currentUser.role] || 0;
            let roles = (currentUser.role === "owner") ? ["member", "tester", "admin", "developer", "co-owner"] : ["member", "tester", "admin", "developer"];
            let cI = roles.indexOf(accounts[idx].role);
            if(cI === -1) cI = 0;
            accounts[idx].role = roles[(cI + 1) % roles.length];
            db.ref('accounts').set(accounts);
        }

        function openBanModal(idx) { 
            selectedUserIdx = idx; 
            document.getElementById('ban-target-name').innerText = "BANNING: " + accounts[idx].name; 
            document.getElementById('ban-reason').value = ""; 
            document.getElementById('ban-modal').style.display = "block"; 
        }
        function closeBanModal() { document.getElementById('ban-modal').style.display = "none"; }
        function submitBan() { 
            accounts[selectedUserIdx].status = "Banned"; 
            accounts[selectedUserIdx].banData = { reason: document.getElementById('ban-reason').value || "Violation of rules." }; 
            db.ref('accounts').set(accounts).then(() => closeBanModal()); 
        }
        function unban(idx) { accounts[idx].status = "Active"; accounts[idx].banData = null; db.ref('accounts').set(accounts); }
        function removeAcc(idx) { if(confirm("Delete Account?")) { accounts.splice(idx, 1); db.ref('accounts').set(accounts); } }
        
        function togglePanelVisibility() {
            const p = document.getElementById('staff-panel');
            const btn = document.getElementById('toggle-panel-btn');
            if(!p || !btn) return;
            if (p.style.display === "none") {
                p.style.display = "block";
                btn.innerText = "MINIMIZE PANEL";
            } else {
                p.style.display = "none";
                btn.innerText = "VIEW STAFF PANEL";
            }
        }

        function showBanUI(reason) { 
            const frame = document.getElementById('main-card-frame');
            if(frame) frame.classList.remove('dashboard-active');
            showScreen('banned-screen'); 
            const reasonEl = document.getElementById('display-ban-reason');
            if(reasonEl) reasonEl.innerText = reason; 
        }
        function handleLogout() { localStorage.removeItem('nls_session'); location.reload(); }
        
        function showScreen(id) { 
            const frame = document.getElementById('main-card-frame');
            if (frame) {
                if (id === 'dashboard') {
                    frame.classList.add('dashboard-active');
                } else {
                    frame.classList.remove('dashboard-active');
                }
            }
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen')); 
            const targetScreen = document.getElementById(id);
            if(targetScreen) targetScreen.classList.add('active-screen'); 
        }
    </script>
</body>
</html>
